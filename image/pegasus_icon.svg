<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A3B8C"/>
      <stop offset="100%" stop-color="#2D2160"/>
    </linearGradient>
    <linearGradient id="wingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8D8FF"/>
      <stop offset="100%" stop-color="#B79CFF"/>
    </linearGradient>
  </defs>

  <!-- Fondo circular -->
  <circle cx="200" cy="200" r="190" fill="#F4F0FF"/>

  <!-- Ala trasera -->
  <path d="M 195 190
           C 150 150, 90 140, 45 165
           C 90 175, 130 190, 160 215
           C 130 210, 95 225, 65 250
           C 105 250, 140 250, 170 260
           C 150 265, 125 280, 110 300
           C 145 290, 175 275, 200 260
           Z"
        fill="url(#wingGrad)" opacity="0.85"/>

  <!-- Cuerpo y cuello -->
  <path d="M 195 145
           C 175 140, 155 150, 148 172
           C 143 190, 150 205, 165 218
           L 158 245
           C 155 260, 160 275, 175 285
           L 195 320
           L 210 320
           L 205 285
           C 218 280, 225 268, 222 253
           L 235 240
           C 250 235, 258 220, 253 205
           C 248 190, 233 182, 218 185
           L 225 165
           C 228 152, 220 142, 207 140
           C 202 139, 198 141, 195 145 Z"
        fill="url(#bodyGrad)"/>

  <!-- Cabeza -->
  <path d="M 207 140
           C 215 128, 232 122, 246 128
           C 258 133, 264 146, 260 158
           C 257 168, 247 174, 236 172
           L 225 165
           Z"
        fill="url(#bodyGrad)"/>

  <!-- Crin -->
  <path d="M 210 138 C 218 128, 216 116, 206 110 C 212 122, 208 130, 198 135 Z" fill="#8B6FE8"/>
  <path d="M 200 148 C 206 138, 202 128, 192 124 C 198 134, 195 142, 186 146 Z" fill="#8B6FE8"/>

  <!-- Pata delantera -->
  <path d="M 210 320 L 206 345 L 216 345 L 220 320 Z" fill="url(#bodyGrad)"/>
  <!-- Pata trasera -->
  <path d="M 175 285 L 168 315 L 178 315 L 185 288 Z" fill="url(#bodyGrad)"/>

  <!-- Ala delantera (encima del cuerpo) -->
  <path d="M 210 175
           C 250 155, 300 150, 340 175
           C 300 180, 265 195, 240 218
           C 270 210, 305 218, 335 240
           C 300 240, 270 245, 245 258
           C 265 260, 290 272, 305 288
           C 275 282, 245 270, 222 255
           Z"
        fill="url(#wingGrad)"/>

  <!-- Ojo -->
  <circle cx="247" cy="145" r="3.5" fill="#1A1440"/>

  <!-- Estrellas decorativas -->
  <g fill="#B79CFF" opacity="0.7">
    <circle cx="90" cy="90" r="3"/>
    <circle cx="320" cy="90" r="2.5"/>
    <circle cx="330" cy="310" r="3"/>
    <circle cx="70" cy="300" r="2"/>
  </g>
</svg>
